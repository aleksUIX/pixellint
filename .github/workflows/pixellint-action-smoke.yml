name: pixellint-action-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "action.yml"
      - ".github/workflows/pixellint-action-smoke.yml"
      - "fixtures/vendor-linkedin/clean-conversion.txt"
      - "fixtures/vendor-meta/missing-pixel-id.txt"
  push:
    branches:
      - main
    paths:
      - "action.yml"
      - ".github/workflows/pixellint-action-smoke.yml"
      - "fixtures/vendor-linkedin/clean-conversion.txt"
      - "fixtures/vendor-meta/missing-pixel-id.txt"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test in-repo pixellint action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Probe CLI binaries
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/aleksUIX/pixellint/releases/latest/download/pixellint-linux-x86_64.tar.gz"
          if curl -fsIL "$url" >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No CLI tarball on the latest GitHub Release yet. Attach binaries via the Release workflow_dispatch, then re-run."
          fi

      - name: Valid fixture should pass
        if: steps.probe.outputs.ready == 'true'
        uses: ./
        with:
          path: fixtures/vendor-linkedin/clean-conversion.txt
          version: latest

      - name: Invalid fixture should fail
        if: steps.probe.outputs.ready == 'true'
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          path: fixtures/vendor-meta/missing-pixel-id.txt
          version: latest

      - name: Assert invalid fixture failed as expected
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.invalid.outcome }}" != "failure" ]]; then
            echo "Expected invalid fixture step to fail, got: ${{ steps.invalid.outcome }}"
            exit 1
          fi
