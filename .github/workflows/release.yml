name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check that the tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="pixellint-core") | .version')
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # Publish order matters: the dependents resolve pixellint-core from the
      # registry, so core has to be visible in the index before they build.
      # A publish failure fails the job. Only an exact version that is already
      # on crates.io is treated as done, because treating any nonzero exit as
      # "already published" is how releases go missing.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; cannot publish."
            exit 1
          fi

          published() {
            local crate="$1" version="$2"
            curl -sf -H "User-Agent: pixellint-release" \
              "https://crates.io/api/v1/crates/$crate/$version" > /dev/null
          }

          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="pixellint-core") | .version')

          for crate in pixellint-core pixellint pixellint-mcp pixellint-wasm; do
            if published "$crate" "$version"; then
              echo "$crate $version is already on crates.io; skipping."
              continue
            fi

            echo "Publishing $crate $version"
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"

            for attempt in $(seq 1 30); do
              if published "$crate" "$version"; then
                echo "$crate $version is visible in the index."
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "$crate $version never became visible; stopping."
                exit 1
              fi
              sleep 10
            done
          done

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Build fresh rather than publishing the committed artifact, so the npm
      # package always matches the crate it is cut from.
      - name: Build the WASM bundle
        run: wasm-pack build crates/pixellint-wasm --target nodejs --out-dir ../../npm/wasm --out-name pixellint

      - name: Drop the generated package metadata
        run: rm -f npm/wasm/package.json npm/wasm/README.md npm/wasm/.gitignore

      - name: Stamp the package version from the tag
        working-directory: npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Test the package
        working-directory: npm
        run: node test.mjs

      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi

          version=$(node -p "require('./package.json').version")
          if npm view "pixellint@$version" version > /dev/null 2>&1; then
            echo "pixellint $version is already on npm; skipping."
            exit 0
          fi

          npm publish --access public

  github-release:
    needs: [publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
