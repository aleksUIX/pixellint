name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach CLI binaries to (for example v0.12.0)
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check that the tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            tag="${tag#v}"
          fi
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="pixellint-core") | .version')
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match workspace version $version"
            exit 1
          fi

  publish-crates:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # Publish order matters: the dependents resolve pixellint-core from the
      # registry, so core has to be visible in the index before they build.
      # A publish failure fails the job. Only an exact version that is already
      # on crates.io is treated as done, because treating any nonzero exit as
      # "already published" is how releases go missing.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; cannot publish."
            exit 1
          fi

          published() {
            local crate="$1" version="$2"
            curl -sf -H "User-Agent: pixellint-release" \
              "https://crates.io/api/v1/crates/$crate/$version" > /dev/null
          }

          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="pixellint-core") | .version')

          for crate in pixellint-core pixellint pixellint-mcp pixellint-wasm; do
            if published "$crate" "$version"; then
              echo "$crate $version is already on crates.io; skipping."
              continue
            fi

            echo "Publishing $crate $version"
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"

            for attempt in $(seq 1 30); do
              if published "$crate" "$version"; then
                echo "$crate $version is visible in the index."
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "$crate $version never became visible; stopping."
                exit 1
              fi
              sleep 10
            done
          done

  publish-npm:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # Node 24 ships npm 11.5+, which is the floor for trusted publishing.
      # Do not set registry-url: setup-node would write an empty _authToken
      # and npm would skip OIDC.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use current npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          echo "npm $(npm --version)"

      # Build fresh rather than publishing the committed artifact, so the npm
      # package always matches the crate it is cut from.
      - name: Build the WASM bundle
        run: wasm-pack build crates/pixellint-wasm --target nodejs --out-dir ../../npm/wasm --out-name pixellint

      - name: Drop the generated package metadata
        run: rm -f npm/wasm/package.json npm/wasm/README.md npm/wasm/.gitignore

      - name: Stamp the package version from the tag
        working-directory: npm
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Test the package
        working-directory: npm
        run: node test.mjs

      # Trusted publisher on npmjs.com must match this job:
      #   GitHub Actions, aleksUIX/pixellint, workflow filename release.yml,
      #   environment production, allowed action npm publish (not stage-only).
      # Do not pass registry-url or NODE_AUTH_TOKEN.
      - name: Publish
        working-directory: npm
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          if npm view "pixellint@$version" version > /dev/null 2>&1; then
            echo "pixellint $version is already on npm; skipping."
            exit 0
          fi

          npm publish --access public --provenance

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: pixellint-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: pixellint-linux-aarch64.tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            archive: pixellint-macos-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            archive: pixellint-macos-aarch64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      # aarch64-unknown-linux-musl needs a cross linker. `cross` silently
      # falls back to host cargo here, the same trap vastlint hit.
      - name: Set up cross toolchain (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p pixellint

      - name: Package
        run: |
          BINARY=target/${{ matrix.target }}/release/pixellint
          tar czf ${{ matrix.archive }} -C "$(dirname "$BINARY")" "$(basename "$BINARY")"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  github-release:
    needs: [verify, build, publish-crates, publish-npm]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      # Re-running the workflow is the normal way to finish a release that was
      # gated on a missing secret, so creating the release has to be safe to
      # repeat. Without this the whole run fails on `tag_name already exists`
      # long after the publish steps have done their work.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          notes="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; refreshing its notes."
            gh release edit "$TAG" --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes"
          fi

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach CLI binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" artifacts/* --clobber
