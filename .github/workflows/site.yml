name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/pixellint-core/**"
      - "crates/pixellint-wasm/**"
      - "wrangler.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # Rebuild rather than trusting the committed artifact, so the deployed
      # playground always matches the core in this commit.
      - name: Build the WASM bundle
        run: wasm-pack build crates/pixellint-wasm --target web --out-dir ../../site/wasm --out-name pixellint

      - name: Drop the generated package metadata
        run: rm -f site/wasm/package.json site/wasm/README.md site/wasm/.gitignore

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy."
            exit 0
          fi
          npx --yes wrangler@4 deploy
