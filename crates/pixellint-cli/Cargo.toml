[package]
name = "pixellint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pixellint-core"
description = "Pixellint CLI: validates pixels, postbacks, conversion API payloads, and tracking URLs against spec-backed and vendor-documented rulepacks"
keywords = ["pixel", "adtech", "tracking", "validator", "capi"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[[bin]]
name = "pixellint"
path = "src/main.rs"

[dependencies]
pixellint-core = { path = "../pixellint-core", version = "0.16.0" }
serde_json = "1"

[dev-dependencies]
pixellint-core = { path = "../pixellint-core", version = "0.16.0" }
