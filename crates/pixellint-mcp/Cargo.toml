[package]
name = "pixellint-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pixellint-core"
description = "MCP server for Pixellint: exposes pixel, postback, and tracking URL validation as callable tools"
keywords = ["pixel", "adtech", "mcp", "validator", "tracking"]
categories = ["development-tools", "web-programming"]
readme = "../../README.md"

[[bin]]
name = "pixellint-mcp"
path = "src/main.rs"

[dependencies]
pixellint-core = { path = "../pixellint-core", version = "0.14.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"