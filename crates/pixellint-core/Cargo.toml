[package]
name = "pixellint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pixellint core: spec-backed validation engine and declarative rulepacks for pixels, postbacks, conversion API payloads, and tracking URLs"
keywords = ["pixel", "adtech", "tracking", "validator", "capi"]
categories = ["parser-implementations", "development-tools"]
readme = "../../README.md"

[dependencies]
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2.5"
