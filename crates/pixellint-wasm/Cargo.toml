[package]
name = "pixellint-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pixellint-core"
description = "WASM bindings for pixellint-core: validate pixels, postbacks, and tracking URLs in the browser, Node, and edge workers"
keywords = ["pixel", "adtech", "tracking", "validator", "wasm"]
categories = ["parser-implementations", "wasm"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pixellint-core = { path = "../pixellint-core", version = "0.8.0" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
