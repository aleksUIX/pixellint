[workspace]
members = [
    "crates/pixellint-core",
    "crates/pixellint-cli",
    "crates/pixellint-mcp",
    "crates/pixellint-wasm",
    "crates/pixellint-bench",
]
resolver = "2"

[workspace.package]
version = "0.61.0"
edition = "2024"
rust-version = "1.88"
authors = ["Aleks <aleks@vastlint.org>"]
license = "Apache-2.0"
repository = "https://github.com/aleksUIX/pixellint"
homepage = "https://pixellint.org"

# Tests inherit this profile. Keep routine builds small across release worktrees.
[profile.dev]
debug = 0
incremental = false
